<!-- Gradientes/texturas do móvel. Fica fora do SVG do rail porque o rail some
     (display:none) no mobile e gradientes dentro de SVG oculto deixam de renderizar. -->
<svg class="movel-defs" aria-hidden="true" focusable="false" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
        <!-- Madeiras: apenas tons da paleta (#5f5549, #85603f, #cba26b, #f9e4b7) -->
        <linearGradient id="mv-wood-carcass" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#5f5549"/>
            <stop offset="0.5" stop-color="#725b44"/>
            <stop offset="1" stop-color="#5f5549"/>
        </linearGradient>
        <linearGradient id="mv-wood-door" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#85603f"/>
            <stop offset="0.45" stop-color="#9a744c"/>
            <stop offset="1" stop-color="#85603f"/>
        </linearGradient>
        <linearGradient id="mv-wood-shelf" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#a88155"/>
            <stop offset="1" stop-color="#85603f"/>
        </linearGradient>
        <linearGradient id="mv-wood-back" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5f5549"/>
            <stop offset="1" stop-color="#4c443a"/>
        </linearGradient>
        <pattern id="mv-grain" patternUnits="userSpaceOnUse" width="38" height="11">
            <path d="M0 3 Q9.5 1 19 3 T38 3 M0 8.5 Q9.5 10 19 8 T38 8.5" fill="none" stroke="#f9e4b7" stroke-opacity="0.14" stroke-width="0.6"/>
        </pattern>
        <linearGradient id="mv-gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#cba26b"/>
            <stop offset="0.5" stop-color="#f9e4b7"/>
            <stop offset="1" stop-color="#cba26b"/>
        </linearGradient>
        <linearGradient id="mv-led-glow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f9e4b7" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#f9e4b7" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="mv-sheen" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.38"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="mv-shadow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#5f5549" stop-opacity="0.5"/>
            <stop offset="1" stop-color="#5f5549" stop-opacity="0"/>
        </radialGradient>
        <clipPath id="mv-clip-cabinet">
            <rect x="66" y="104" width="268" height="414"/>
        </clipPath>
    </defs>
</svg>
